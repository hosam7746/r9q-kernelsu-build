name: Build KernelSU LKM for Samsung r9q QGKI 5.4

on:
  workflow_dispatch:
    inputs:
      kernelsu_tag:
        description: "KernelSU version. v0.9.5 is the final upstream version supporting 5.4 kernels."
        required: true
        default: "v0.9.5"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      LLVM: "1"
      LLVM_IAS: "1"
      DEFCONFIG: vendor/r9q_eur_openx_defconfig
      OUT_DIR: out

    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libelf-dev libssl-dev \
            lld llvm pahole python3 python-is-python3 rsync \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Report build tools
        run: |
          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version

      - name: Add KernelSU 0.9.5 as a loadable module
        env:
          KSU_TAG: ${{ inputs.kernelsu_tag }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$KSU_TAG" https://github.com/tiann/KernelSU.git KernelSU
          ln -s ../../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Configure KernelSU as LKM
        run: |
          set -euxo pipefail
          make O="$OUT_DIR" "$DEFCONFIG"
          scripts/config --file "$OUT_DIR/.config" --module KSU
          make O="$OUT_DIR" olddefconfig
          grep -E 'CONFIG_(KSU|MODULES|KPROBES|EXT4_FS|OVERLAY_FS|MODVERSIONS)=' "$OUT_DIR/.config"

      - name: Build kernel and KernelSU module
        run: |
          set -o pipefail
          make -j"$(nproc)" O="$OUT_DIR" 2>&1 | tee build.log
          test -f "$OUT_DIR/drivers/kernelsu/kernelsu.ko"

      - name: Package artifact
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp "$OUT_DIR/drivers/kernelsu/kernelsu.ko" artifact/kernelsu-r9q-qgki-5.4.289.ko
          cp "$OUT_DIR/.config" artifact/r9q_eur_openx.config
          cp "$OUT_DIR/Module.symvers" artifact/Module.symvers
          cp build.log artifact/build.log
          modinfo artifact/kernelsu-r9q-qgki-5.4.289.ko | tee artifact/modinfo.txt
          sha256sum artifact/kernelsu-r9q-qgki-5.4.289.ko | tee artifact/SHA256SUMS

      - name: Upload module and verification data
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-lkm-r9q-qgki-5.4.289
          path: artifact/
          if-no-files-found: error
          retention-days: 14
